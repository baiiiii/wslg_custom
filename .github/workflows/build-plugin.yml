name: Build WSLDVCPlugin

# 验证 WSLDVCPlugin 的 Windows 构建链（后续在此基础上加入文本输入桥修改）。
# 手动触发；产物：WSLDVCPlugin.dll（x64 Release）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 克隆 WSLDVCPlugin 源码
        shell: bash
        run: git clone --branch main --depth 1 https://github.com/baiiiii/wslg.git wslg

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: MSBuild x64 Release
        shell: cmd
        run: msbuild wslg\WSLDVCPlugin\WSLDVCPlugin.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /m

      - name: 上传 DLL 工件
        uses: actions/upload-artifact@v4
        with:
          name: WSLDVCPlugin-x64
          path: wslg/WSLDVCPlugin/**/WSLDVCPlugin.dll
          if-no-files-found: error
