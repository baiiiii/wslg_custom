name: Diagnose Patch

# 轻量诊断：只克隆 weston 并尝试应用补丁，输出冲突详情
# 用于定位补丁与目标 weston 版本的差异，不做完整构建
on:
  workflow_dispatch:
    inputs:
      weston_ref:
        description: 'weston commit 或分支（目标版本）'
        required: true
        default: 'a7e35fdab455dce5774b43b8aff682f748307e31'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 克隆 weston 并测试补丁
        env:
          WESTON_REF: ${{ inputs.weston_ref }}
        run: |
          set -uo pipefail
          git clone --quiet https://github.com/microsoft/weston-mirror weston
          cd weston
          git checkout --quiet "$WESTON_REF"
          git config user.email "ci@local"
          git config user.name "ci"

          PATCH="$GITHUB_WORKSPACE/patch-files/weston/base-2318feca.patch"

          echo "===== 目标 weston commit ====="
          git rev-parse HEAD

          echo "===== 补丁统计 ====="
          git apply --stat "$PATCH" || true

          echo ""
          echo "===== 尝试 git apply --3way ====="
          if git apply --3way --whitespace=nowarn "$PATCH"; then
            echo "RESULT: CLEAN_APPLY_SUCCESS"
          else
            echo "RESULT: APPLY_FAILED"
            echo ""
            echo "===== 未合并的文件 ====="
            git diff --name-only --diff-filter=U || true
            echo ""
            echo "===== 冲突片段（含冲突标记的上下文）====="
            for f in $(git diff --name-only --diff-filter=U 2>/dev/null); do
              echo "########## FILE: $f ##########"
              awk '/^<<<<<<</{c=1; n=0} c{print NR": "$0; n++} /^>>>>>>>/{c=0; print "----- (共 "n" 行) -----"}' "$f" | head -80
            done
            echo ""
            echo "===== 完整 diff ====="
            git diff | head -200
          fi

          echo ""
          echo "===== 补丁涉及的文件清单 ====="
          grep "^diff --git" "$PATCH" | sed 's|diff --git a/||; s| b/.*||'
