name: Build WSLg v1.0.79 Custom Image

# ═══════════════════════════════════════════════════════════════════
# 本分支（v1.0.79）固定用于构建 WSLg v1.0.79 的定制镜像。
# 所有组件版本锁定为 v1.0.79 的官方配套版本，来源：该版本运行环境的
# /mnt/wslg/versions.txt —— 保证构建产物与目标版本严格对应。
#
# 要构建其他 WSLg 版本时：从 main 新建对应分支（如 v1.0.80），
# 修改下方 env 中的各组件 ref，不要在 main 上直接改。
# ═══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  # 仅当补丁变化时自动构建；workflow 自身或其他文件的改动不触发，
  # 避免出现"改了文档也跑一遍全量 Docker 构建"的浪费
  push:
    branches: [v1.0.79]
    paths:
      - 'patch-files/**'

env:
  WSLG_TAG: v1.0.79
  WESTON_REF: working
  FREERDP_REF: c4030980b29322a9cb2190711a5fadeeeb8b6a33
  PULSEAUDIO_REF: c33051f2296af748ac5cd13e51abfac4d129e4c7
  MESA_REF: mesa-23.1.0
  DIRECTX_REF: v1.608.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出本仓库（提供 weston 补丁）
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Go（tar2ext4 由构建脚本通过 go run 拉取）
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 克隆 WSLg 与各组件源码
        run: |
          set -euo pipefail
          git clone --branch "$WSLG_TAG" --depth 1 https://github.com/microsoft/wslg.git wslg
          cd wslg

          # weston 不指定 -b 以保留完整历史：git apply --3way 需要原始 blob 做三方合并
          git clone https://github.com/baiiiii/weston-mirror      vendor/weston
          git clone https://github.com/microsoft/FreeRDP-mirror     vendor/FreeRDP
          git clone https://github.com/microsoft/PulseAudio-mirror  vendor/pulseaudio
          git clone -b "$DIRECTX_REF" https://github.com/microsoft/DirectX-Headers.git vendor/DirectX-Headers-1.0
          git clone -b "$MESA_REF"    https://gitlab.freedesktop.org/mesa/mesa.git     vendor/mesa

          git -C vendor/weston     checkout "$WESTON_REF"
          git -C vendor/FreeRDP    checkout "$FREERDP_REF"
          git -C vendor/pulseaudio checkout "$PULSEAUDIO_REF"

          echo "=== 各组件实际使用的版本 ==="
          for d in weston FreeRDP pulseaudio mesa DirectX-Headers-1.0; do
            printf '%-24s %s\n' "$d" "$(git -C "vendor/$d" rev-parse HEAD)"
          done

      - name: 构建 system distro 镜像
        run: |
          set -euo pipefail
          cd wslg
          chmod +x build-and-export.sh devops/get-nuget-version.sh 2>/dev/null || true
          bash build-and-export.sh

      - name: 记录产物信息
        run: |
          ls -lh wslg/system_x64.vhd
          sha256sum wslg/system_x64.vhd | tee wslg/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wslg-v1.0.79-system-x64-vhd
          path: |
            wslg/system_x64.vhd
            wslg/SHA256SUMS.txt
          retention-days: 7

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wslg-v1.0.79-custom.${{ github.run_number }}
          name: WSLg v1.0.79 定制版（白边修复）
          files: |
            wslg/system_x64.vhd
            wslg/SHA256SUMS.txt
          draft: false
          body: |
            ## WSLg v1.0.79 定制构建

            | 项目 | 值 |
            | --- | --- |
            | WSLg 基线 | `microsoft/wslg` @ `v1.0.79` |
            | weston | `a7e35fdab455dce5774b43b8aff682f748307e31` |
            | FreeRDP | `c4030980b29322a9cb2190711a5fadeeeb8b6a33` |
            | pulseaudio | `c33051f2296af748ac5cd13e51abfac4d129e4c7` |
            | mesa | `mesa-23.1.0` |
            | DirectX-Headers | `v1.608.0` |
            | 应用补丁 | `patch-files/weston/base-2318feca.patch` |
            | 构建流水线 | run #${{ github.run_number }} |

            ### 补丁内容
            - 消除 X11 窗口左、下、右三处的白色边框
            - `Alt+F11` 窗口化 / 最大化切换
            - `Alt+F12` 标题栏模式 / 无边框模式切换
            - `Alt+左键拖动` 调整窗口大小
            - `Alt+右键拖动` 移动窗口
            - 支持从 Windows 剪贴板粘贴图片
            - 点击左上角标题栏图标切换浅色 / 深色

            ### 使用方法
            1. 下载 `system_x64.vhd`，例如放到 `C:\wslg\system_x64.vhd`
            2. 编辑 `%UserProfile%\.wslconfig`，在 `[wsl2]` 节中加一行：

               ```ini
               [wsl2]
               systemDistro=C:\\wslg\\system_x64.vhd
               ```

            3. 执行 `wsl --shutdown`，之后启动任意 WSL 发行版即生效
            4. 验证：`cat /mnt/wslg/versions.txt`

            ### 回滚
            删除 `.wslconfig` 里的 `systemDistro` 行，再执行 `wsl --shutdown`。

            ---
            > 本镜像由 GitHub Actions 自动构建，未经过人工测试，使用前请自行评估。
